# Checks only — deployment is handled by Dokploy on push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json # engines.node
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build before tests: tests/production-css.test.ts inspects dist/.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify:css
